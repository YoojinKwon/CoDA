# NOTE: set to null for passing None value

# Defaults
project_name: 'imagenet_resnet50_fp'
save_path: './checkpoint/imagenet_resnet50_fp'
random_seed: 1234

# Models
model_arch: 'resnet50'
q_scheme: null # null for fp
q_bits_w: null
q_bits_a: null

# Dataset
dataset: 'imagenet'
dataset_path: '/ssd/datasets/ILSVRC12/'
batch_size: 256 
num_workers: 2
input_size: 224

# Training
epochs: 90
last_epoch: 0
update_freq: 1
val_freq: 1
optim: "sgd"
kwargs_optim:
  lr: 0.1
  momentum: 0.9
  weight_decay: 1.0e-4
lrsch: 'step'
kwargs_lrsch:
  'step_size': 30
  'gamma': 0.1

# Frequency Filtering
freq: 0
use_fft: false

# Checkpoints
pretrained: false
checkpoint_path: null

# Logging
use_wandb: false